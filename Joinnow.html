<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account for Starbucks Rewards Program</title>
    <link rel="stylesheet" href="./Joinnow.css">
    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <!-- font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.css">

</head>
<body>
    <header>
        <div class="topnav">
            
                <a href="./Index.html"><img src="./Source/Logo.png" alt="" href="./index.html"></a>
            
        </div>
    </header>
    
    <main>
        <div class="joinnow">
            <h1>Create an account</h1>
            
            <p>Personal info</p>
                <div class="line"></div>
                <div class="input">
                    <input type="text" placeholder="First name" id="fname">
                    <input type="text" placeholder="Last name" id="lname">
                </div>
                
            <p>Security</p>
                <div class="line"></div>
                <div class="input">
                    <input type="email" placeholder="Email adress" id="email">
                    <input type="password" placeholder="password" id="password">
                </div>
            <div class="terms">
                <input type="checkbox" id="mails"><label for="mails">Get emails from starbucks(optional)</label>
                <p>Know about products, offers, announcements and initiatives.</p>
                <input type="checkbox" id="terms"><label for="terms">I accept the term of use</label>
                <p>By signing up, I agree to the
                    <a href="#">Starbucks Web Terms<i class="fa-solid fa-arrow-up-right-from-square"></i></a>,
                    <a href="#">Privacy notice<i class="fa-solid fa-arrow-up-right-from-square"></i></a>,
                    <a href="#">Rewards terms<i class="fa-solid fa-arrow-up-right-from-square"></i></a> and 
                    <a href="#">Card Terms<i class="fa-solid fa-arrow-up-right-from-square"></i>.</a>
                </p>
            </div>
            <button>Create account</button>
            <p>Already have an account?<a href="./Sign-in.html">Sign in</a></p>
        </div>
    </main>
</body>
</html>
