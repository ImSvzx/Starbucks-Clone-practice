<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign into Starbucks Rewards Account</title>
    <link rel="stylesheet" href="./Sign-in.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <div class="topnav">
            
                <a href="./Index.html"><img src="./Source/Logo.png" alt="" href="./index.html"></a>
            
        </div>
    </header>
    <main>
        <div class="signin">
            <h1>Welcome back!</h1>
            <div class="input">
                <input type="Email" placeholder="Email address" id="email">
                <input type="password" placeholder="Password" id="pass">
            </div>
            <div class="remember">
                <input type="checkbox"><label>Keep me signed in.<a href="#">Details</a></label>
                <a href="#">Forgot Password?</a>
            </div>
            <button>Sign in</button>
            <p>Don't have an account?<a href="./Joinnow.html">Join Now</a></p>
        </div>
    </main>
</body>
</html>
